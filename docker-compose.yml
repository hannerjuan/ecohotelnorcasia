services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecohotel
      POSTGRES_USER: ecohotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecohotel}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecohotel"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecohotel:${POSTGRES_PASSWORD:-ecohotel}@db:5432/ecohotel?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ecohotelmadeguadua@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
